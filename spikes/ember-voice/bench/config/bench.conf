# Ember voice benchmark. The spoken lines live in corpus/ember-voice-corpus.json.
# That file is the local copy of the corpus. event-contracts/ will own the shared one.

corpus=corpus/ember-voice-corpus.json

# Reuses the spike's downloaded model and 24 kHz CC0 voice. ./setup.sh creates them.
model_dir=../mac/models/sherpa-onnx-pocket-tts-int8-2026-01-26
model_name=sherpa-onnx-pocket-tts-int8-2026-01-26
voice=../mac/models/voices/0a67_enhanced-24k.wav
voice_license=CC0
voice_source=kyutai/tts-voices voice-donations/0a67_enhanced.wav

# Offline ASR for the intelligibility check. Weights stay gitignored.
asr_dir=models/sherpa-onnx-whisper-tiny.en
asr_encoder=tiny.en-encoder.int8.onnx
asr_decoder=tiny.en-decoder.int8.onnx
asr_tokens=tiny.en-tokens.txt
asr_name=sherpa-onnx-whisper-tiny.en-int8

# Current spike defaults. This is the baseline the quick wins are measured against.
num_threads=2
num_steps=5
temperature=0.7
chunk_size=2
max_char_in_sentence=120
provider=cpu
# PocketTTS reads this from GenerationConfig.extra. Same seed on every call.
seed=1
# sherpa uses sherpa-onnx's own splitter. ours is the bench chunker (phase 1).
chunker=sherpa
# 0 leaves sherpa-onnx's default max_frames (500). A positive value is passed through.
max_frames=0
# preload dummy synthesis before the cold line. Off for the baseline.
warmup=false
warm_runs=10
pass_warm_ttfa_ms=500
pass_warm_rtf=1.5
# Expected speech is about 15 characters per second, with a 0.8 s floor.
# A run is a runaway when audio seconds exceed twice that.
chars_per_second=15
min_expected_audio_s=0.8
runaway_factor=2
