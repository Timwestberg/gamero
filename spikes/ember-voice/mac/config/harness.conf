# Ember voice PocketTTS timing harness.
# This file is the only place the test lines and the voice live.
# Lines that start with # are comments. Do not put a # inside a text value.

sherpa_version=2.0.0
model_dir=models/sherpa-onnx-pocket-tts-int8-2026-01-26
model_url=https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/sherpa-onnx-pocket-tts-int8-2026-01-26.tar.bz2

# Reference clip for the int8 sherpa-onnx PocketTTS build.
# PocketTTS clones this wav. It does not use a speaker id.
# Keep this on a CC0 clip from kyutai/tts-voices voice-donations/.
# Do not point it at models/.../test_wavs (those are Expresso, CC-BY-NC).
# setup.sh downloads the 32 kHz donation and writes this 24 kHz file once.
# PocketTTS speaks at 24 kHz. A 24 kHz prompt skips the per-call resample.
voice=models/voices/0a67_enhanced-24k.wav
voice_url=https://huggingface.co/kyutai/tts-voices/resolve/main/voice-donations/0a67_enhanced.wav
voice_license=CC0
voice_source=kyutai/tts-voices voice-donations/0a67_enhanced.wav

num_threads=2
num_steps=5
temperature=0.7
# Decoder frames per callback. 1 frame is 80 ms of audio. Any integer >= 1 works.
# The language model still finishes the first text piece before the first callback,
# so this mostly changes how the already-generated audio is sliced.
# ./run.sh --sweep tries the list below and prints TTFA against RTF.
# Linux VM sweep (24 kHz voice, max_char 120, 10 warm runs): every size held RTF
# above 2.6x. 2 is the smallest. Warm TTFA was a little lower there than at 15
# (deploy_blocked 1055 vs 1381 ms, say_limit 1565 vs 1783 ms). First callback is
# 160 ms of audio instead of 1.20 s.
chunk_size=2
sweep_chunk_sizes=2,4,6,10,15
# Sherpa's own default is 200. say_limit has no period, so 200 leaves a 196-character
# first piece and the first audio waits on that whole piece (~3.5 s on the Linux VM).
# 120 cuts only that line, into 116 + 119. A 4-run probe dropped its warm TTFA to ~1.7 s
# and kept RTF ~3.4x. 80 was faster (~1.2 s) but also chopped summary into "tests." and
# "before merge.", so 120 is the default.
max_char_in_sentence=120
warm_runs=10
pass_warm_ttfa_ms=500
pass_warm_rtf=1.5

# id then text. Order is the order the harness speaks.
line.id=build_passed
line.text=Done! Your build passed.

line.id=task_finished
line.text=I finished the task. Three files changed and all tests are green.

line.id=sign_in
line.text=Heads up, Codex needs you to sign in before I can keep going on this one.

line.id=deploy_blocked
line.text=The deploy is blocked: the API returned error 503 at 2:45 PM. I'll retry in 30 seconds, or you can check the logs.

line.id=summary
line.text=Here's the summary: I refactored PetSession.kt, moved the socket code into PetBridge, updated the README, and added two tests. Everything builds, but the voice settings still need a final review from you before merge.

# 236 characters. The pet say limit is 240.
line.id=say_limit
line.text=This is the longest note the pet is allowed to say, just under the two hundred forty character cap, so we can hear a full status update: the build is green, two tests were added, and now the voice settings need your review before merge.
