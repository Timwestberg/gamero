<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Gamero native bridge smoke</title>
<body><h1>Gamero embedded interface</h1><p id="agent"></p>
<button id="probe">Check version 1 is refused</button><button id="probe2">Check host bridge v2</button><button id="navigate">Reload this page</button>
<pre id="result">No native request made.</pre>
<iframe title="Untrusted child" sandbox="allow-scripts" srcdoc="<p>Opaque child frame</p>"></iframe>
<script>
document.querySelector('#agent').textContent = navigator.userAgent;
const output = document.querySelector('#result');
function query(method, args, contextId, persistent = false) {
  return new Promise((resolve, reject) => {
    if (typeof window.gameroQuery !== 'function') return reject(new Error('Native router unavailable'));
    const request = {version: 1, method, args};
    if (contextId) request.contextId = contextId;
    window.gameroQuery({request: JSON.stringify(request), persistent,
      onSuccess: value => resolve(JSON.parse(value)), onFailure: (code, message) => reject(new Error(code + ': ' + message))});
  });
}
// The old version 1 protocol is gone: expect "400: Invalid native protocol".
document.querySelector('#probe').onclick = async () => {
  try {
    const context = await query('watchContext', {}, null, true);
    output.textContent = 'Unexpected: version 1 answered ' + JSON.stringify(context);
  } catch (error) { output.textContent = String(error); }
};
// host-bridge.v2: one persistent watchContext query; every reply is an envelope.
function query2(request, persistent, onEvent) {
  return new Promise((resolve, reject) => {
    if (typeof window.gameroQuery !== 'function') return reject(new Error('Native router unavailable'));
    let first = true;
    window.gameroQuery({request: JSON.stringify(request), persistent,
      onSuccess: value => { const reply = JSON.parse(value); if (first) { first = false; resolve(reply); } else onEvent?.(reply); },
      onFailure: (code, message) => reject(new Error(code + ': ' + message))});
  });
}
document.querySelector('#probe2').onclick = async () => {
  const lines = [];
  const timed = async (label, request, persistent = false) => {
    const start = performance.now();
    const reply = await query2(request, persistent, event => lines.push('event ' + JSON.stringify(event)));
    lines.push(`${label} ${Math.round(performance.now() - start)}ms ${JSON.stringify(reply)}`);
    return reply;
  };
  try {
    const {contextId} = await timed('watchContext', {version: 2, method: 'watchContext', args: {}}, true);
    const call = (method, args = {}) => timed(method, {version: 2, contextId, method, args});
    await call('host.capabilities');
    await call('host.info');
    await call('companion.capabilities');
    await call('haptic.play', {effect: 'light'});
    await call('link.close');
    await timed('stale context', {version: 2, contextId: '0b8e4b52-3c1d-4e2f-9a6b-7c8d9e0f1a2b', method: 'host.info', args: {}});
    await timed('non-persistent watch', {version: 2, method: 'watchContext', args: {}});
  } catch (error) { lines.push(String(error)); }
  output.textContent = lines.join('\n');
  console.log('GAMERO_BRIDGE_V2_SMOKE\n' + output.textContent);
};
document.querySelector('#navigate').onclick = () => location.reload();
</script></body></html>
